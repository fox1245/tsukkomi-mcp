[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tsukkomi-mcp"
version = "0.5.0"
description = "Tsukkomi MCP: Deterministic governance, invariant contracts, and Tsukkomi harness for autonomous AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "neograph-engine==0.12.1",
  "mcp>=1.0,<2",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.0"]

[project.scripts]
tsukkomi-mcp = "self_directing_mcp.server:main"
self-directing-mcp = "self_directing_mcp.server:main"
tsukkomi-install-codex = "self_directing_mcp.install_codex:main"
self-directing-install-codex = "self_directing_mcp.install_codex:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
self_directing_mcp = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
