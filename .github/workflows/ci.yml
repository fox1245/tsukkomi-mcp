name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (dev)
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"


      - name: Run smoke tests
        run: >-
          python -m pytest -q
          tests/test_mcp_transport.py
          tests/test_workflow_jev.py
          tests/test_windows_session_paths.py
          tests/test_journal.py
          tests/test_graph_host_extraction.py
          tests/test_slice_capture.py
          tests/test_slice_equivalence.py
          tests/test_slice_settings.py
          tests/test_slice_flight.py
          tests/test_slice_adapters.py
          tests/test_reindex_spool.py
          tests/test_reindex_equivalence.py
          tests/test_reindex_staging.py
          tests/test_eval_cost.py
          tests/test_zstd_stream.py
          tests/test_codex_zstd_discovery.py
          tests/test_codex_zstd.py
          --deselect tests/test_codex_zstd.py::test_syncing_a_large_compressed_session_never_materializes_it
          --deselect tests/test_codex_zstd.py::test_continuing_a_cursor_inside_a_large_compressed_source_streams_from_the_start
        env:
          SELF_DIRECT_USE_FAKE_EMBEDDER: "true"

      - name: Build distribution
        run: python -m build

  memory-audit-regressions:
    # Linux coverage complements, rather than replaces, the cross-platform smoke job.
    # Keep larger allocation probes out of CI; small regressions do not certify live-service RSS.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SELF_DIRECT_USE_FAKE_EMBEDDER: "true"
      SELF_DIRECT_DENSE_BACKEND: "numpy"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (dev)
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"

      - name: Run offline memory, freshness, and concurrency regressions
        timeout-minutes: 10
        run: >-
          python -m pytest -q
          tests/test_audit_memory.py
          tests/test_audit_prefix.py
          tests/test_action_prefix_freshness.py
          tests/test_append_capture.py
          tests/test_source_capture.py
          tests/test_source_io_consumers.py
          tests/test_sync_idsets.py
          tests/test_singleflight.py
          tests/test_index_concurrency.py
          tests/test_server_concurrency.py
          tests/test_requirement_checklist.py
          tests/test_timeout_regression.py
          tests/test_tool_timeout_arg.py
          tests/test_request_stats.py
          tests/test_degraded_evaluation.py
          tests/test_server_ops.py
          tests/test_quiet_hooks.py
          tests/test_agy_hooks.py
          tests/test_agy_policy.py
          tests/test_contract_risk_when.py
          tests/test_common_judgement_fixture.py
          tests/test_reliability.py
          tests/test_hook_gating.py
          tests/test_claude_provider.py
          tests/test_claude_hooks.py
          tests/test_claude_install.py
          tests/test_hook_import_budget.py
          tests/test_hook_settings_parity.py
          tests/test_journal.py
          tests/test_journal_engine.py
          tests/test_shadow_schedule.py
          tests/test_shadow_detection.py
          tests/test_shadow_review.py
          tests/test_slice_capture.py
          tests/test_slice_equivalence.py
          tests/test_slice_faults.py
          tests/test_slice_convergence.py
          tests/test_slice_settings.py
          tests/test_slice_flight.py
          tests/test_slice_adapters.py
          tests/test_reindex_spool.py
          tests/test_reindex_equivalence.py
          tests/test_reindex_staging.py
          tests/test_reindex_faults.py
          tests/test_reindex_convergence.py
          tests/test_eval_cost.py
          tests/test_eval_converges.py
          tests/test_eval_reindex.py
          tests/test_bench_eval_converge.py
          tests/test_runtime_threads.py
          --deselect tests/test_append_capture.py::test_capture_is_bounded_hashed_and_does_not_retain_the_file

  bench:
    # Hook cost on synthetic data (scripts/bench_hooks.py): cold command hooks, warm server calls and idle servers.
    # Fails above 1.5x the targets for what this branch gates; the large (300 MB) session is a local, opt-in run.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (dev)
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"

      - name: Benchmark hook cost (small sessions)
        timeout-minutes: 8
        run: >-
          python scripts/bench_hooks.py --check --contracts 10,100 --runs 12 --warm-repeat 8
          --sessions 4 --servers 12 --out bench-hooks.json --markdown bench-hooks.md

      - name: Publish the table
        if: always()
        run: test -f bench-hooks.md && cat bench-hooks.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-hooks-report
          path: |
            bench-hooks.json
            bench-hooks.md
          if-no-files-found: ignore
          retention-days: 30
