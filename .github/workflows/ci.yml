name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (dev)
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"


      - name: Run smoke tests
        run: >-
          python -m pytest -q
          tests/test_mcp_transport.py
          tests/test_workflow_jev.py
          tests/test_windows_session_paths.py
          tests/test_journal.py
          tests/test_graph_host_extraction.py
          tests/test_contract_bundles.py
          tests/test_portable_contracts.py
          tests/test_slice_capture.py
          tests/test_slice_equivalence.py
          tests/test_slice_settings.py
          tests/test_slice_flight.py
          tests/test_slice_adapters.py
          tests/test_reindex_spool.py
          tests/test_reindex_equivalence.py
          tests/test_reindex_staging.py
          tests/test_eval_cost.py
          tests/test_sparse_compact.py
          tests/test_sparse_compact_mutations.py
          tests/test_sparse_formats.py
          tests/test_sparse_orphans.py
          tests/test_grok_tools.py
          tests/test_grok_provider.py
          tests/test_grok_hooks.py
          tests/test_grok_install.py
          tests/test_grok_claude_bypass.py
          tests/test_sparse_settings.py
          tests/test_zstd_stream.py
          tests/test_codex_zstd_discovery.py
          tests/test_codex_zstd.py
          tests/test_pgvector_unit.py
          tests/test_pgvector_config.py
          --deselect tests/test_codex_zstd.py::test_syncing_a_large_compressed_session_never_materializes_it
          --deselect tests/test_codex_zstd.py::test_continuing_a_cursor_inside_a_large_compressed_source_streams_from_the_start
        env:
          SELF_DIRECT_USE_FAKE_EMBEDDER: "true"

      - name: Build distribution
        run: python -m build

  memory-audit-regressions:
    # Linux coverage complements, rather than replaces, the cross-platform smoke job.
    # Keep larger allocation probes out of CI; small regressions do not certify live-service RSS.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SELF_DIRECT_USE_FAKE_EMBEDDER: "true"
      SELF_DIRECT_DENSE_BACKEND: "numpy"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (dev)
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"

      - name: Run offline memory, freshness, and concurrency regressions
        timeout-minutes: 10
        run: >-
          python -m pytest -q
          tests/test_audit_memory.py
          tests/test_audit_prefix.py
          tests/test_action_prefix_freshness.py
          tests/test_append_capture.py
          tests/test_source_capture.py
          tests/test_source_io_consumers.py
          tests/test_sync_idsets.py
          tests/test_sparse_compact.py
          tests/test_sparse_compact_mutations.py
          tests/test_sparse_formats.py
          tests/test_sparse_orphans.py
          tests/test_grok_tools.py
          tests/test_grok_provider.py
          tests/test_grok_hooks.py
          tests/test_grok_install.py
          tests/test_grok_claude_bypass.py
          tests/test_sparse_settings.py
          tests/test_singleflight.py
          tests/test_index_concurrency.py
          tests/test_server_concurrency.py
          tests/test_requirement_checklist.py
          tests/test_timeout_regression.py
          tests/test_tool_timeout_arg.py
          tests/test_request_stats.py
          tests/test_degraded_evaluation.py
          tests/test_server_ops.py
          tests/test_quiet_hooks.py
          tests/test_agy_hooks.py
          tests/test_agy_policy.py
          tests/test_contract_risk_when.py
          tests/test_common_judgement_fixture.py
          tests/test_reliability.py
          tests/test_hook_gating.py
          tests/test_claude_provider.py
          tests/test_claude_hooks.py
          tests/test_claude_install.py
          tests/test_hook_import_budget.py
          tests/test_hook_settings_parity.py
          tests/test_contract_bundles.py
          tests/test_portable_contracts.py
          tests/test_portable_contracts_docs.py
          tests/test_portable_contract_hooks.py
          tests/test_contract_repository.py
          tests/test_journal.py
          tests/test_journal_engine.py
          tests/test_shadow_schedule.py
          tests/test_shadow_detection.py
          tests/test_shadow_review.py
          tests/test_slice_capture.py
          tests/test_slice_equivalence.py
          tests/test_slice_faults.py
          tests/test_slice_convergence.py
          tests/test_slice_settings.py
          tests/test_slice_flight.py
          tests/test_slice_adapters.py
          tests/test_reindex_spool.py
          tests/test_reindex_equivalence.py
          tests/test_reindex_staging.py
          tests/test_reindex_faults.py
          tests/test_reindex_convergence.py
          tests/test_eval_cost.py
          tests/test_eval_converges.py
          tests/test_eval_reindex.py
          tests/test_bench_eval_converge.py
          tests/test_bench_sparse.py
          tests/test_runtime_threads.py
          tests/test_pgvector_unit.py
          tests/test_pgvector_config.py
          tests/test_dense_backend_parity.py
          --deselect tests/test_append_capture.py::test_capture_is_bounded_hashed_and_does_not_retain_the_file

  pgvector:
    # The optional pgvector dense backend against a real pgvector server: a service container of the image the tests were
    # written against, and the official sqlite-vector library for the three-way parity tests. Linux only. A failure here
    # fails the workflow (no continue-on-error); TSUKKOMI_REQUIRE_PGVECTOR makes a missing server a failure, never a skip.
    # The password below belongs to this throwaway container on the runner and protects nothing.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-throwaway-service-password
          POSTGRES_DB: tsukkomi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tsukkomi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SELF_DIRECT_USE_FAKE_EMBEDDER: "true"
      TSUKKOMI_REQUIRE_PGVECTOR: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (dev and the pgvector extra)
        run: python -m pip install -U pip && python -m pip install -e ".[dev,pgvector]"

      - name: Provision sqlite-vector for the parity tests
        run: |
          python scripts/setup_sqlite_vector.py --output-dir "$RUNNER_TEMP/native"
          echo "SQLITE_VECTOR_TEST_PATH=$RUNNER_TEMP/native/vector.so" >> "$GITHUB_ENV"

      - name: Write the private connection-string file
        run: |
          umask 077
          printf 'host=127.0.0.1 port=5432 dbname=tsukkomi_ci user=postgres password=%s\n' "ci-throwaway-service-password" > "$RUNNER_TEMP/pgvector-dsn.txt"
          echo "TSUKKOMI_PGVECTOR_TEST_DSN_FILE=$RUNNER_TEMP/pgvector-dsn.txt" >> "$GITHUB_ENV"

      - name: Run the pgvector tests
        timeout-minutes: 15
        run: >-
          python -m pytest -q -rs
          tests/test_pgvector_unit.py
          tests/test_pgvector_config.py
          tests/test_pgvector_integration.py
          tests/test_pgvector_engine.py
          tests/test_dense_backend_parity.py

  bench:
    # Hook cost on synthetic data (scripts/bench_hooks.py): cold command hooks, warm server calls and idle servers.
    # Fails above 1.5x the targets for what this branch gates; the large (300 MB) session is a local, opt-in run.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (dev)
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"

      - name: Benchmark hook cost (small sessions)
        timeout-minutes: 8
        run: >-
          python scripts/bench_hooks.py --check --contracts 10,100 --runs 12 --warm-repeat 8
          --sessions 4 --servers 12 --out bench-hooks.json --markdown bench-hooks.md

      - name: Publish the table
        if: always()
        run: test -f bench-hooks.md && cat bench-hooks.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-hooks-report
          path: |
            bench-hooks.json
            bench-hooks.md
          if-no-files-found: ignore
          retention-days: 30
