name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (dev)
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest -q
        env:
          SELF_DIRECT_USE_FAKE_EMBEDDER: "true"

      - name: Build distribution
        run: python -m build

      - name: Synthetic offline performance gate
        run: python scripts/benchmark.py
        env:
          SELF_DIRECT_USE_FAKE_EMBEDDER: "true"

      - name: Large-session concurrent audit gate
        run: python scripts/benchmark_large.py --events 3000
        env:
          SELF_DIRECT_USE_FAKE_EMBEDDER: "true"
