name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (dev)
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"


      - name: Run smoke tests
        run: >-
          python -m pytest -q
          tests/test_mcp_transport.py
          tests/test_workflow_jev.py
          tests/test_windows_session_paths.py
        env:
          SELF_DIRECT_USE_FAKE_EMBEDDER: "true"

      - name: Build distribution
        run: python -m build
