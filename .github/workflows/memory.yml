name: Memory
# Memory and thread-safety verification, after NeoGraph's sanitizer CI:
#   asan  - ASan + UBSan + LSan. neograph-engine and sqlite-vector are rebuilt from pinned, digest-verified
#           sources with sanitizers and the whole suite runs against them (scripts/verify_memory.py).
#   tsan  - ThreadSanitizer over the same native code and the whole suite.
#   soak  - a long-running server loop through the MCP tool entry points, with the official sqlite-vector
#           release: retained heap, file descriptors and threads must plateau (scripts/memory_soak.py).
# Canaries run first in each sanitizer job, so "no reports" is evidence that the sanitizer was live.
#
# Runs on pull requests to main, on main, nightly and on demand (Actions -> Memory -> Run workflow).
# The sanitizer builds of the native libraries are cached by the pins in verify_memory.py and pyproject.toml;
# a cold build of neograph-engine takes about 45 minutes on a hosted runner.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memory-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sanitizer:
    name: ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        profile: [asan, tsan]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OUT: build/memory/${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build libssl-dev libcurl4-openssl-dev \
            libpq-dev libsqlite3-dev binutils util-linux

      # The key covers what the build depends on (pins, flags, gcc, Python minor), not the script's other code.
      - name: Compute the native build key
        id: key
        run: echo "value=$(python scripts/verify_memory.py key --profile ${{ matrix.profile }})" >> "$GITHUB_OUTPUT"

      - name: Restore sanitizer builds
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.OUT }}/wheels
            ${{ env.OUT }}/vector.so
            ${{ env.OUT }}/manifest.json
          key: memory-${{ matrix.profile }}-${{ runner.os }}-${{ steps.key.outputs.value }}

      - name: Build neograph-engine and sqlite-vector with ${{ matrix.profile }}
        id: native
        run: |
          python -m pip install -U pip
          python scripts/verify_memory.py native --profile ${{ matrix.profile }} --out "$OUT"

      # Saved as soon as the build exists, even if a later step fails: the build itself is valid.
      - name: Save sanitizer builds
        if: always() && steps.native.outcome == 'success' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.OUT }}/wheels
            ${{ env.OUT }}/vector.so
            ${{ env.OUT }}/manifest.json
          key: memory-${{ matrix.profile }}-${{ runner.os }}-${{ steps.key.outputs.value }}

      - name: Install the sanitizer build and the package
        run: |
          python -m pip install "$OUT"/wheels/neograph_engine-*.whl
          python -m pip install -e ".[dev]"

      - name: Prove the sanitizer detects its canaries
        run: python scripts/verify_memory.py canary --profile ${{ matrix.profile }} --out "$OUT"

      - name: Run the tests under ${{ matrix.profile }}
        timeout-minutes: 90
        run: python scripts/verify_memory.py test --profile ${{ matrix.profile }} --out "$OUT"

      - name: Upload sanitizer logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: memory-${{ matrix.profile }}-logs
          path: ${{ env.OUT }}/logs
          if-no-files-found: ignore
          retention-days: 14

  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (dev)
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"

      - name: Install the official sqlite-vector release
        run: python scripts/setup_sqlite_vector.py --output-dir "$RUNNER_TEMP/native"

      - name: Soak the MCP tool loop
        timeout-minutes: 30
        run: >-
          python scripts/memory_soak.py --check --cycles 320 --report soak.json
          --dense-backend sqlite-vector --vector-path "$RUNNER_TEMP/native/vector.so"

      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-soak-report
          path: soak.json
          if-no-files-found: ignore
          retention-days: 30
